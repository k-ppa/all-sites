<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tally counter with variable increment value and target options (mode to measure speed under development)">
  <title>Clicker</title>
  <link rel="stylesheet" href="ClickerStyle.css">
</head>
<body>
  <div id="heading">
    <img src="Icons/more_vert.svg" alt="more" class="topButtons" id="moreButton" onclick="moree()" title="More...">
    <h1>CLICKER</h1>
    <img src="Icons/light_mode.svg" alt="mode" class="topButtons" id="modeButton" onclick="darkMode()" title="Theme">
  </div>
  <hr>
  <button id="counting" onclick="nash()">CLICK!</button>
  <button id="reset" onclick="restart()">Reset</button>
  <p id="counter">
    0
  </p>
  <div id="bottom">
    <p class="small" id="maximum"></p>
    <p class="small" id="stepValue">
      1
    </p>
  </div>

  <div id="overlay" onclick="closeMenu()"></div>
  <div id="sideMenu">
    <div id="moreHeading">
      <h3>More</h3>
      <img src="Icons/arrow_back_ios.svg" alt="back" class="topButtons" id="closeButton" onclick="closeMenu()" title="Back">
    </div>
    <hr id="sideUnderline">
    <button id="aim" class="options" onclick="targett()">Target</button>
    <button id="gap" class="options" onclick="intervall()">Interval</button>
    <button id="speed" class="options" onclick="fast()">Speed</button><br>
    <input id="max" placeholder="Enter target" type="number"><br>
    <input id="sliding" type="range" min="-5" max="4">
    <p id="stepLabel"></p>
  </div>
  <script src="ClickerScript.js"></script>
</body>
</html>
